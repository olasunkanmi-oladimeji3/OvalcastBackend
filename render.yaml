# Render Blueprint for the Ovalcast API. New -> Blueprint, pick this repository, and fill in every
# setting marked sync: false (they never live in this file). Full list: .env.example.
services:
  - type: web
    name: ovalcast-api
    runtime: node
    region: frankfurt
    plan: free # starter (or above) for production: free instances sleep when idle
    # --include=dev: NODE_ENV=production would otherwise skip the build tools (esbuild, prisma).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations before the new version takes traffic, over DIRECT_DATABASE_URL (prisma.config.ts).
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging # production once live keys are in
      - key: NODE_VERSION
        value: '24'
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL # Supabase transaction pooler (port 6543)
        sync: false
      - key: DIRECT_DATABASE_URL # Supabase session pooler (port 5432), for migrations
        sync: false
      - key: DATABASE_CA_CERT # Supabase's SSL certificate text (\n for line breaks)
        sync: false
      - key: SECRETS_KEY # openssl rand -base64 32
        sync: false
      - key: PUBLIC_URL # this service's https address
        sync: false
      - key: WEB_URL # the website's https address
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: INTERNAL_API_TOKEN # openssl rand -hex 24, the same on the website
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY # FLWSECK_TEST-… on staging
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: ALLOW_CONSOLE_MESSAGING # true on staging without SMS/email: codes go to the log
        sync: false
      - key: STORAGE_DRIVER # s3 for production; local is fine for a short-lived staging server
        sync: false
