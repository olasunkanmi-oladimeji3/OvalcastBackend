<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {font-family: Arial, sans-serif; background:#f5f5f5; color:#333; margin:0; padding:20px;}
    .container {max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
    h1 {color:#00573a;}
    .button {
      display:inline-block; padding:10px 20px; margin-top:15px; background:#00573a; color:#fff; text-decoration:none; border-radius:4px;
    }
    .footer {font-size:0.9em; color:#777; margin-top:20px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Welcome to Ovalcast!</h1>
    <p>Thanks for signing up! Please verify your email address to start using Ovalcast.</p>
    <p>Click the button below or copy the link to your browser:</p>
    <a href="https://ovalcast.app/verify?token={{TOKEN}}" class="button">Verify My Email</button>
    <p style="font-size:0.9em; color:#777;">If you didn't request this, you can safely ignore this email.</p>
    <p>Best regards,<br/>Ovalcast Team</p>
  </div>
</body>
</html>
